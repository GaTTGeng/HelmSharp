apiVersion: v1
kind: ConfigMap
metadata:
  name: child
data:
  dependencyCount: {{ len .Chart.Dependencies | quote }}
  global: {{ .Values.global.shared | quote }}
  root: {{ include "child.root" (dict "root" .) | quote }}
{{- define "child.root" -}}
{{ .root.Values.config.color }}:{{ .root.Chart.Name }}:{{ .root.Template.Name }}
{{- end }}
